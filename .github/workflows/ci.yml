name: ci

# Runs on every push to main and on pull requests. The release
# workflow (release.yml) repeats these checks before publishing.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # JDK 19+ required: Double/toString only became guaranteed-shortest
        # then (JDK-4511638). On older JDKs cedn emits non-shortest doubles,
        # diverging from JS. Test the oldest supported and the current LTS.
        java: ['21', '25']
    steps:
      - uses: actions/checkout@v6

      - name: Install JDK ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Install bb, clj, clj-kondo, cljfmt
        uses: DeLaGuardo/setup-clojure@13.6.0
        with:
          bb: 'latest'
          cli: 'latest'
          clj-kondo: 'latest'
          cljfmt: 'latest'

      - name: Cache Maven and gitlibs
        uses: actions/cache@v5
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: deps-${{ runner.os }}-${{ matrix.java }}-${{ hashFiles('deps.edn', 'bb.edn') }}
          restore-keys: deps-${{ runner.os }}-${{ matrix.java }}-

      - name: Prefetch test deps
        run: |
          java -version
          clojure -P -M:test

      - name: Run library tests (JVM, incl. property tests)
        run: bb test:jvm

      - name: Run library tests (bb)
        run: bb test:bb

      - name: Run CLI tests (dev mode)
        run: bb test:cli

      - name: Lint
        run: bb lint

      - name: Format check
        run: bb fmt

  # ClojureScript, nbb and the browser. Separate job so the browser is
  # downloaded once, in parallel with the JVM matrix. shadow-cljs needs a
  # JVM; nbb and Scittle do not.
  js:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Install JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install bb, clj
        uses: DeLaGuardo/setup-clojure@13.6.0
        with:
          bb: 'latest'
          cli: 'latest'

      - uses: actions/setup-node@v5
        with:
          node-version: '26'
          cache: npm

      - name: Cache Maven and gitlibs
        uses: actions/cache@v5
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: deps-js-${{ runner.os }}-${{ hashFiles('deps.edn', 'bb.edn', 'shadow-cljs.edn') }}
          restore-keys: deps-js-${{ runner.os }}-

      - name: Install npm deps and nbb
        run: |
          npm ci
          npm i -g nbb

      # The runner's preinstalled Chrome: Playwright's own browser download
      # stalled on GitHub runners (2026-09-23; published hung for 6 hours).
      - name: Use the runner's Chrome
        run: |
          CHROME_PATH="$(command -v google-chrome || command -v google-chrome-stable)"
          "$CHROME_PATH" --version
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"

      - name: Run library tests (shadow-cljs / Node)
        run: bb test:cljs

      - name: Run library tests (nbb)
        run: bb test:nbb

      - name: Smoke-test the nbb git-dependency path
        run: bb test:nbb-dep

      - name: Run browser tests (Scittle, headless Chromium)
        run: bb test:scittle

      - name: Check dist/cedn.cljc is up to date
        # dist/ is generated from src/ and served to browsers by jsdelivr
        # at whatever tag the README pins, so a stale dist/ in a release
        # commit ships old code to CDN users.
        run: |
          bb build:scittle
          git diff --exit-code -- dist/cedn.cljc \
            || { echo "::error::dist/cedn.cljc is stale — run 'bb build:scittle' and commit"; exit 1; }
